name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: 'stable'

      - name: Accept Android Licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Install Flet and Requirements
        run: |
          python -m pip install --upgrade pip
          pip install "flet==0.23.2" requests
          echo -e "flet==0.23.2\nrequests" > requirements.txt

      - name: Build APK
        run: |
          flet build apk --no-rich-output --verbose

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YouTube-Bot-APK
          path: build/apk/*.apk
