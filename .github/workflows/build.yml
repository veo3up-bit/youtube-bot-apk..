name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet==0.23.2 google-api-python-client google-auth-oauthlib

      - name: Build APK
        run: |
          flet build apk --verbose --include-packages google_api_python_client google_auth_oauthlib

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YouTube-Bot-APK
          path: build/apk/*.apk
